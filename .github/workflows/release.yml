name: Release

# Builds the Catalyst installers and publishes them to a GitHub Release.
# The release assets double as the auto-update feed: tauri-action emits a signed
# `latest.json` that the in-app updater polls (see src-tauri/tauri.conf.json).
#
# To cut a release: bump the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, commit, then push a matching tag:
#
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # macOS bundles are unsigned (see MACOS.md) and are the more fragile leg —
      # never let them hold back the Windows installer.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos-arm64

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # postinstall (build/prepare-sidecar-bin.js) copies this runner's Node
      # binary into src-tauri/binaries/ as the bundled sidecar runtime, so the
      # Node that resolves node-pty here is the Node that ships.
      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Catalyst __VERSION__'
          releaseBody: |
            ## Install

            **Windows** — download `Catalyst_<version>_x64-setup.exe` and run it.
            Installs per-user, no admin required.

            **macOS (Apple Silicon)** — download the `.dmg`. The build is
            unsigned, so clear the quarantine flag on first run:
            `xattr -dr com.apple.quarantine /Applications/Catalyst.app`

            Existing installs pick this up automatically via the in-app updater.
          releaseDraft: false
          prerelease: false
          # Emits and merges latest.json across matrix legs for the updater.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
