name: Release

# Builds the Catalyst installers and publishes them to a GitHub Release.
# The release assets double as the auto-update feed: tauri-action emits a signed
# `latest.json` that the in-app updater polls (see src-tauri/tauri.conf.json).
#
# To cut a release: bump the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, commit, then push a matching tag:
#
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # macOS bundles are unsigned (see MACOS.md) and are the more fragile leg —
      # never let them hold back the Windows installer.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos-arm64

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # postinstall (build/prepare-sidecar-bin.js) copies this runner's Node
      # binary into src-tauri/binaries/ as the bundled sidecar runtime, so the
      # Node that resolves node-pty here is the Node that ships.
      - name: Install dependencies
        run: npm ci

      # Apple codesigning + notarisation, but only when the credentials exist.
      # Tauri reads these from the environment; an empty APPLE_* value is worse
      # than an absent one, because it makes the bundler attempt to sign with
      # nothing and fail the build. So export them only when they are really set,
      # and otherwise say plainly that the .dmg will be unsigned.
      #
      # To get signed + notarised macOS builds, add these repository secrets:
      #   APPLE_CERTIFICATE           base64 of your Developer ID .p12
      #   APPLE_CERTIFICATE_PASSWORD  the .p12 export password
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID                    your Apple ID email
      #   APPLE_PASSWORD              an app-specific password for that Apple ID
      #   APPLE_TEAM_ID               your 10-character team ID
      - name: Configure Apple signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_IN: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_IN: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_IN: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "::notice::No Apple signing secrets configured — publishing an unsigned .dmg. Users will need to clear the quarantine flag on first launch (see MACOS.md)."
            exit 0
          fi

          echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Notarisation needs all three; signing alone still beats nothing, so
          # don't fail the build when only the certificate is available.
          if [ -n "$APPLE_ID_IN" ] && [ -n "$APPLE_PASSWORD_IN" ] && [ -n "$APPLE_TEAM_ID_IN" ]; then
            echo "APPLE_ID=$APPLE_ID_IN" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_IN" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_IN" >> "$GITHUB_ENV"
            echo "::notice::Signing and notarising the macOS bundle."
          else
            echo "::notice::Signing the macOS bundle, but not notarising — APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are needed for that."
          fi

      # Authenticode signing for the NSIS installer, on the same
      # only-when-configured basis as the Apple step above.
      #
      # Without it, Chrome refuses to name the finished download: it lands as
      # "Unconfirmed <n>.crdownload" with the bytes complete but the rename
      # withheld, and SmartScreen warns on first run. That is reputation, not
      # corruption — an unsigned installer from a new publisher has none.
      #
      # To sign, add these repository secrets:
      #   WINDOWS_CERTIFICATE           base64 of your code-signing .pfx
      #   WINDOWS_CERTIFICATE_PASSWORD  the .pfx export password
      #
      # An OV certificate builds reputation over time; an EV certificate carries
      # it immediately. Note this path is untested — it cannot run until a real
      # certificate exists, so treat the first signed release as the test.
      - name: Configure Windows signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT)) {
            Write-Output "::notice::No Windows signing secrets configured - publishing an unsigned installer. Chrome will hold the download as 'Unconfirmed .crdownload' and SmartScreen will warn on first run until a certificate is added."
            "args=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "catalyst-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $secure = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force

          # Passed as a config overlay rather than committed, so the thumbprint
          # (which is specific to the imported cert) never lands in the repo.
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $path = Join-Path $env:GITHUB_WORKSPACE "signing.conf.json"
          $overlay | ConvertTo-Json -Depth 6 | Set-Content -Path $path -Encoding utf8
          "args=--config $path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "::notice::Signing the Windows installer with certificate $($cert.Thumbprint)."

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on macOS, where the signing step above does not run.
          args: ${{ steps.winsign.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Catalyst __VERSION__'
          releaseBody: |
            ## Install

            **Windows** — download `Catalyst_<version>_x64-setup.exe` and run it.
            Installs per-user, no admin required.

            **macOS (Apple Silicon)** — download the `.dmg` and drag Catalyst to
            Applications. If macOS blocks the first launch, the build was not
            notarised: right-click Catalyst and choose **Open**, or run
            `xattr -dr com.apple.quarantine /Applications/Catalyst.app`

            Existing installs pick this up automatically via the in-app updater.
          releaseDraft: false
          prerelease: false
          # Emits and merges latest.json across matrix legs for the updater.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
