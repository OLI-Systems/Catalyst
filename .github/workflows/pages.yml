name: Deploy Pages

# Publishes the static showcase site in site/ to GitHub Pages.
# Requires Settings → Pages → Source = "GitHub Actions" (one-time, in the repo).

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let an in-flight deploy finish rather than
# cancelling it — a half-deployed Pages site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # Note: this cannot enable Pages for the repository. configure-pages'
      # `enablement` input explicitly requires a token other than GITHUB_TOKEN,
      # so the Pages site has to be created once by hand — see README.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
