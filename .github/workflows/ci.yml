name: CI

# Proves the Windows installer still builds on every push and PR, so a broken
# bundle is caught here rather than when a release tag is pushed. Does not sign
# or publish anything — release.yml owns that.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # tauri.conf.json declares sidecar/**/* as a bundle resource, and
      # tauri-build fails the build script if that glob matches nothing. The
      # directory is generated, not committed, so it must be staged before any
      # cargo command runs — including clippy. `tauri build` below re-stages it
      # via beforeBuildCommand, which is idempotent.
      - name: Stage the Node sidecar
        run: npm run stage

      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # tauri.conf.json sets createUpdaterArtifacts, so the build hard-fails
      # without a signing key. Use a throwaway one: this job only proves the
      # bundle assembles, and it keeps the workflow runnable on fork PRs that
      # cannot read repository secrets.
      - name: Generate throwaway signing key
        shell: bash
        run: |
          npx tauri signer generate -w "$RUNNER_TEMP/ci.key" --password ""
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/ci.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Build installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: catalyst-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
