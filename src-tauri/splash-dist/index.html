<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;-webkit-app-region:drag}
  body{background:var(--bg,#06080d);color:var(--text,#fff);transition:background 0.5s ease}

  canvas#particles{position:fixed;inset:0;z-index:0}

  .splash{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:1;transition:opacity 0.8s ease}
  .splash.fade-out{opacity:0}

  .glow{position:absolute;width:450px;height:450px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(56,189,248,0.08)) 0%,transparent 70%);filter:blur(70px);opacity:0;animation:glowIn 2s ease 0.3s forwards}
  @keyframes glowIn{to{opacity:1}}

  .logo-wrap{position:relative;width:150px;height:150px;margin-bottom:36px}
  .logo-svg{width:100%;height:100%;opacity:0;animation:logoFade 0.6s ease 0.4s forwards}
  @keyframes logoFade{to{opacity:1}}

  .logo-svg .hex{stroke:var(--accent,#38bdf8);stroke-dasharray:120;stroke-dashoffset:120;animation:drawHex 1.4s ease 0.5s forwards}
  @keyframes drawHex{to{stroke-dashoffset:0}}

  .logo-svg .antenna{stroke:var(--accent,#38bdf8);stroke-dasharray:10;stroke-dashoffset:10;animation:drawAntenna 0.5s ease 1.2s forwards}
  @keyframes drawAntenna{to{stroke-dashoffset:0}}

  .logo-svg .core{fill:var(--accent,#38bdf8);opacity:0;animation:coreIn 0.8s ease 1.0s forwards}
  @keyframes coreIn{to{opacity:0.5}}

  .logo-svg .node{fill:var(--accent,#38bdf8);opacity:0;transform-origin:center;animation:nodeIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.4s forwards}
  @keyframes nodeIn{to{opacity:1}}

  .logo-pulse{position:absolute;inset:-20px;border-radius:50%;border:1px solid var(--pulse,rgba(56,189,248,0.15));opacity:0;animation:pulse 2s ease 1.6s infinite}
  @keyframes pulse{0%{opacity:0.4;transform:scale(0.85)}50%{opacity:0;transform:scale(1.3)}100%{opacity:0;transform:scale(1.3)}}
  .logo-pulse:nth-child(2){animation-delay:2.1s}

  .title{font-family:'JetBrains Mono','Cascadia Code','SF Mono','Fira Code','Consolas',monospace;font-size:40px;font-weight:700;letter-spacing:16px;color:transparent;text-indent:16px;position:relative;overflow:hidden;white-space:nowrap}
  .title-letter{display:inline-block;opacity:0;color:var(--text,#eaf1f9);animation:letterIn 0.4s ease forwards;filter:blur(8px)}
  @keyframes letterIn{to{opacity:1;filter:blur(0)}}

  .title-scan{position:absolute;top:0;left:0;width:40px;height:100%;background:linear-gradient(90deg,transparent,var(--scan,rgba(56,189,248,0.25)),transparent);opacity:0;animation:scanLine 1s ease 2.2s forwards}
  @keyframes scanLine{0%{opacity:0.8;left:-40px}100%{opacity:0;left:calc(100% + 40px)}}

  .subtitle{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif;font-size:14px;font-weight:400;color:var(--muted,rgba(139,149,165,0.7));letter-spacing:4px;text-transform:uppercase;margin-top:20px;opacity:0;animation:subIn 0.8s ease 2.6s forwards}
  @keyframes subIn{to{opacity:1}}

  .version{font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace;font-size:11px;color:var(--accent-dim,rgba(56,189,248,0.4));letter-spacing:2px;margin-top:28px;opacity:0;animation:subIn 0.6s ease 3.0s forwards;border:1px solid var(--border,rgba(56,189,248,0.12));padding:5px 16px;border-radius:20px}

  .loader-track{position:fixed;bottom:0;left:0;width:100%;height:2px;background:var(--track,rgba(56,189,248,0.06));z-index:10}
  .loader-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent,#38bdf8),var(--accent-h,#0ea5e9));border-radius:0 1px 1px 0;animation:loadBar 14s cubic-bezier(0.4,0,0.2,1) 0.4s forwards}
  @keyframes loadBar{0%{width:0}30%{width:40%}60%{width:70%}85%{width:88%}95%{width:95%}100%{width:100%}}

  .corner{position:fixed;width:48px;height:48px;opacity:0;animation:cornerIn 0.6s ease 0.8s forwards}
  @keyframes cornerIn{to{opacity:0.3}}
  .corner svg line{stroke:var(--corner,rgba(56,189,248,0.4));stroke-width:1}
  .corner.tl{top:20px;left:20px}
  .corner.tr{top:20px;right:20px}
  .corner.bl{bottom:20px;left:20px}
  .corner.br{bottom:20px;right:20px}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="corner tl"><svg viewBox="0 0 40 40"><line x1="0" y1="0" x2="20" y2="0"/><line x1="0" y1="0" x2="0" y2="20"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 40 40"><line x1="20" y1="0" x2="40" y2="0"/><line x1="40" y1="0" x2="40" y2="20"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 40 40"><line x1="0" y1="20" x2="0" y2="40"/><line x1="0" y1="40" x2="20" y2="40"/></svg></div>
<div class="corner br"><svg viewBox="0 0 40 40"><line x1="40" y1="20" x2="40" y2="40"/><line x1="20" y1="40" x2="40" y2="40"/></svg></div>

<div class="splash" id="splash">
  <div class="glow"></div>

  <div class="logo-wrap">
    <div class="logo-pulse"></div>
    <div class="logo-pulse"></div>
    <svg class="logo-svg" viewBox="0 0 32 32">
      <g fill="none" stroke-width="2.2" stroke-linejoin="round">
        <path class="hex" d="M16 6 L24.66 11 L24.66 21 L16 26 L7.34 21 L7.34 11 Z"/>
        <line class="antenna" x1="16" y1="6" x2="16" y2="3.4"/>
      </g>
      <circle class="core" cx="16" cy="16" r="1.5" opacity="0"/>
      <circle class="node" cx="16" cy="2.4" r="2" opacity="0"/>
    </svg>
  </div>

  <div class="title" id="title">
    <span class="title-scan"></span>
  </div>

  <div class="subtitle">Many minds &middot; one workspace &middot; you're in command</div>

  <div class="version">v1.0.0</div>
</div>

<div class="loader-track"><div class="loader-bar"></div></div>

<script>
(function(){
  var THEMES = {
    midnight:  { bg:'#06080d', accent:'#38bdf8', accentH:'#0ea5e9', text:'#ffffff', muted:'#9bafc6' },
    rose:      { bg:'#faf5f3', accent:'#c2665a', accentH:'#a8524a', text:'#000000', muted:'#6b5550' },
    ocean:     { bg:'#0a1628', accent:'#60a5fa', accentH:'#3b82f6', text:'#ffffff', muted:'#7da0c9' },
    forest:    { bg:'#0a1410', accent:'#4ade80', accentH:'#22c55e', text:'#ffffff', muted:'#7db899' },
    sunset:    { bg:'#1a1008', accent:'#fbbf24', accentH:'#f59e0b', text:'#ffffff', muted:'#c9a87a' },
    lavender:  { bg:'#f5f0fa', accent:'#8b5cf6', accentH:'#7c3aed', text:'#000000', muted:'#5e5070' },
    sand:      { bg:'#f7f3ee', accent:'#8c6e46', accentH:'#745a38', text:'#000000', muted:'#6b5e50' },
    arctic:    { bg:'#f0f5fa', accent:'#2563eb', accentH:'#1d4ed8', text:'#000000', muted:'#4a5568' },
    nord:      { bg:'#2e3440', accent:'#88c0d0', accentH:'#81a1c1', text:'#ffffff', muted:'#8b9ab5' },
    monokai:   { bg:'#1e1f1c', accent:'#a6e22e', accentH:'#8bc621', text:'#ffffff', muted:'#8a8a76' },
    dracula:   { bg:'#1e1f29', accent:'#bd93f9', accentH:'#a77bde', text:'#ffffff', muted:'#7a7896' },
    ember:     { bg:'#110808', accent:'#f87171', accentH:'#ef4444', text:'#ffffff', muted:'#b88a8a' },
    void:      { bg:'#000000', accent:'#ffffff', accentH:'#cccccc', text:'#ffffff', muted:'#777777' },
    copper:    { bg:'#12100e', accent:'#d9a878', accentH:'#c49060', text:'#ffffff', muted:'#a0907c' },
    vsdark:    { bg:'#1e1e1e', accent:'#007acc', accentH:'#1a8fd1', text:'#d4d4d4', muted:'#808080' },
    vslight:   { bg:'#ffffff', accent:'#007acc', accentH:'#005a9e', text:'#1e1e1e', muted:'#616161' },
    bluepill:  { bg:'#000000', accent:'#22d3ee', accentH:'#06b6d4', text:'#d8e4f0', muted:'#5a7a96' },
    graphite:  { bg:'#1a1a1a', accent:'#a0a0a0', accentH:'#888888', text:'#e0e0e0', muted:'#707070' },
    silver:    { bg:'#f0f0f0', accent:'#555555', accentH:'#333333', text:'#1a1a1a', muted:'#666666' },
    newsprint: { bg:'#f5f0e8', accent:'#333333', accentH:'#111111', text:'#111111', muted:'#555555' }
  };

  function hexToRgb(h) {
    var r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
    return r+','+g+','+b;
  }

  var params = new URLSearchParams(location.search);
  var themeName = params.get('theme') || 'midnight';
  var t = THEMES[themeName] || THEMES.midnight;
  var rgb = hexToRgb(t.accent);
  var s = document.documentElement.style;
  s.setProperty('--bg', t.bg);
  s.setProperty('--accent', t.accent);
  s.setProperty('--accent-h', t.accentH);
  s.setProperty('--text', t.text);
  s.setProperty('--muted', t.muted);
  s.setProperty('--glow', 'rgba('+rgb+',0.08)');
  s.setProperty('--pulse', 'rgba('+rgb+',0.15)');
  s.setProperty('--scan', 'rgba('+rgb+',0.25)');
  s.setProperty('--accent-dim', 'rgba('+rgb+',0.4)');
  s.setProperty('--border', 'rgba('+rgb+',0.12)');
  s.setProperty('--track', 'rgba('+rgb+',0.06)');
  s.setProperty('--corner', 'rgba('+rgb+',0.4)');

  // Particle field
  var c = document.getElementById('particles');
  var ctx = c.getContext('2d');
  var W, H, particles = [];

  function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (var i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.15 - 0.1,
      a: Math.random() * 0.4 + 0.1
    });
  }

  function drawParticles() {
    ctx.clearRect(0, 0, W, H);
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba('+rgb+','+p.a+')';
      ctx.fill();
    }

    for (var a = 0; a < particles.length; a++) {
      for (var b = a + 1; b < particles.length; b++) {
        var dx = particles[a].x - particles[b].x;
        var dy = particles[a].y - particles[b].y;
        var dist = dx * dx + dy * dy;
        if (dist < 12000) {
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.strokeStyle = 'rgba('+rgb+','+(0.04 * (1 - dist / 12000))+')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // Letter-by-letter title reveal
  var title = document.getElementById('title');
  var text = 'CATALYST';
  var scan = title.querySelector('.title-scan');
  text.split('').forEach(function(ch, i) {
    var span = document.createElement('span');
    span.className = 'title-letter';
    span.textContent = ch;
    span.style.animationDelay = (1.6 + i * 0.08) + 's';
    title.insertBefore(span, scan);
  });
})();
</script>
</body>
</html>
